[workspace]
resolver = "2"
members = [
  "crates/sirius-app",
  "crates/sirius-backend",
  "crates/sirius-core",
  "crates/sirius-diag",
  "crates/sirius-installer",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
clap = { version = "4", features = ["derive"] }
relm4 = { version = "0.10", features = ["libadwaita", "gnome_45"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
libc = "0.2"
lsblk = "0.6.1"
uuid = { version = "1", features = ["v4"] }
zbus = "5"
zvariant = "5"
libgweather = "4"
# SVG decoding for the timezone map; driven on a dedicated thread through
# async-io (glycin's native runtime), never on the glib main context. Pinned
# to 3.x because its loader protocol (COMPAT_VERSION 2) matches the
# glycin-loaders 2.x packages shipped by Fedora.
glycin = "3.1"
async-io = "2"
# Uses the LuminusOS readymade fork, pinned to the revision carrying the
# Keyboard postinstall module and the bootc finalize fixes Sirius requires.
# `default-features = false` disables the `uutils` feature, which pulls in
# `uu_cp`/`exacl` and forces linking against `libacl.so` (the `libacl-devel`
# system package, absent on this host). It only gates one of three copy backends
# (`copy_dir_uutils`); the default copy method is the native `rdm` implementation,
# so dropping it does not affect the install path we need.
libreadymade = { git = "https://github.com/luminusOS/readymade.git", rev = "255b339430d6cd886bd22cd4517a83a52a3fa541", default-features = false }
sirius-core = { path = "crates/sirius-core" }
sirius-diag = { path = "crates/sirius-diag" }
sirius-backend = { path = "crates/sirius-backend" }
sirius-app = { path = "crates/sirius-app" }
